<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>West-TW 報告資料庫</title>
<style>
/* Layout: 單欄目錄，上方為搜尋與分組標籤，下方為依日期排列的報告與章節條目 */
:root{
  --bg:#eef1f2; --paper:#ffffff; --ink:#172129; --muted:#56636e; --rule:#d3dadf;
  --accent:#a8322a; --accent-tint:rgba(168,50,42,.10); --tw:#1d5596; --tw-tint:rgba(29,85,150,.10);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","WenQuanYi Zen Hei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1316; --paper:#151c21; --ink:#e3e9ed; --muted:#98a5af; --rule:#2b363e;
  --accent:#ec7065; --accent-tint:rgba(236,112,101,.14); --tw:#7eaee9; --tw-tint:rgba(126,174,233,.14); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1316; --paper:#151c21; --ink:#e3e9ed; --muted:#98a5af; --rule:#2b363e;
  --accent:#ec7065; --accent-tint:rgba(236,112,101,.14); --tw:#7eaee9; --tw-tint:rgba(126,174,233,.14); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:880px;margin:0 auto}
header{padding-block:48px 24px;border-bottom:2px solid var(--ink);margin-bottom:24px}
.cls{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--f-display);font-size:clamp(26px,5vw,36px);line-height:1.3;margin:8px 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.stats{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin-top:14px;display:flex;flex-wrap:wrap;gap:4px 18px;font-variant-numeric:tabular-nums}
a{color:var(--tw)}
.controls{display:grid;gap:12px;margin-bottom:18px}
.search{display:flex;gap:10px;flex-wrap:wrap}
.search input{flex:1 1 260px;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--paper)}
.seg button{font:inherit;font-size:14px;border:0;background:none;color:var(--muted);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tags{background:var(--paper);border:1px solid var(--rule);padding:14px 16px;display:grid;gap:12px}
.group{display:grid;grid-template-columns:7.5em 1fr;gap:4px 12px;align-items:start}
.group h2{font-size:13px;font-weight:700;color:var(--muted);margin:5px 0 0;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13.5px;line-height:1;padding:6px 9px;border:1px solid var(--rule);border-radius:3px;background:none;color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--tw)}
.chip[aria-pressed="true"]{background:var(--tw);border-color:var(--tw);color:var(--paper)}
.chip[aria-pressed="true"] .n{color:var(--paper)}
.chip:disabled{opacity:.35;cursor:default;border-color:var(--rule)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.active{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);min-height:28px}
.active .chip{font-size:13px}
.clear{font:inherit;font-size:13.5px;border:0;background:none;color:var(--accent);cursor:pointer;text-decoration:underline;padding:0}
.results{display:grid;gap:12px}
.item{background:var(--paper);border:1px solid var(--rule);padding:16px 18px;display:grid;gap:6px}
.item.report{border-color:var(--ink);border-width:1.5px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.kind{color:var(--accent);font-weight:500}
.item h3{margin:0;font-size:18px;line-height:1.45}
.item h3 a{color:var(--ink);text-decoration:none}
.item h3 a:hover{color:var(--tw);text-decoration:underline}
.item p{margin:0;color:var(--ink)}
.files{font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 14px}
.item .chips{margin-top:4px}
.item .chip{font-size:12.5px;padding:4px 7px}
.empty{color:var(--muted);padding:24px 0}
footer{margin-top:40px;color:var(--muted);font-size:13.5px;border-top:1px solid var(--rule);padding-top:14px}
@media (max-width:560px){.group{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="cls">West-TW · 公開資訊研析</div>
  <h1>West-TW 報告資料庫</h1>
  <p class="sub">點選關鍵字標籤篩選報告與章節；可同時選多個標籤，只顯示全部符合的條目。</p>
  <div class="stats" id="stats"></div>
</header>

<noscript><p>此頁需要啟用 JavaScript 才能篩選。報告列表請見 <a href="README.md">README.md</a>。</p></noscript>

<section class="controls" aria-label="篩選">
  <div class="search">
    <input id="q" type="search" placeholder="搜尋標題、摘要或標籤" aria-label="搜尋">
    <div class="seg" role="group" aria-label="條目類型">
      <button type="button" data-kind="all" aria-pressed="true">全部</button>
      <button type="button" data-kind="report" aria-pressed="false">報告</button>
      <button type="button" data-kind="section" aria-pressed="false">章節</button>
    </div>
  </div>
  <div class="tags" id="tags"></div>
  <div class="active" id="active" aria-live="polite"></div>
</section>

<section class="results" id="results" aria-label="結果"></section>

<footer>
  資料來自 <code>data/catalog.json</code>。新增報告的方式見 <a href="README.md">README.md</a>。所有報告僅彙整公開資訊，標示為推估者不代表已知作戰計畫。
</footer>
</div>

<script src="data/catalog.js?v=dd23222007"></script>
<script>
(function () {
  var cat = window.WEST_TW_CATALOG;
  var resEl = document.getElementById('results');
  if (!cat) { resEl.innerHTML = '<p class="empty">找不到 data/catalog.js，請先執行 python3 tools/build_catalog.py。</p>'; return; }

  // Flatten reports and their sections into one list of filterable entries.
  // A report matches on its own tags plus every section's tags, but its card shows only its own.
  var items = [];
  cat.reports.forEach(function (r) {
    items.push({ kind: 'report', title: r.title, date: r.date, summary: r.summary, show: r.tags, tags: uniq(r.tags.concat.apply(r.tags, (r.sections || []).map(function (s) { return s.tags; }))), href: r.path, files: r.files || [], report: r });
    (r.sections || []).forEach(function (s) {
      items.push({ kind: 'section', title: s.title, date: r.date, summary: s.summary, tags: s.tags, show: s.tags, href: r.path + '#' + s.anchor, report: r });
    });
  });

  var groups = [];
  var known = {};
  Object.keys(cat.tag_groups).forEach(function (g) { groups.push({ name: g, tags: cat.tag_groups[g] }); cat.tag_groups[g].forEach(function (t) { known[t] = 1; }); });
  var other = uniq([].concat.apply([], items.map(function (i) { return i.tags; }))).filter(function (t) { return !known[t]; });
  if (other.length) groups.push({ name: '其他', tags: other });

  var state = { tags: [], q: '', kind: 'all' };
  readHash();

  var qEl = document.getElementById('q');
  qEl.value = state.q;
  qEl.addEventListener('input', function () { state.q = qEl.value.trim(); render(); });
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
    b.addEventListener('click', function () { state.kind = b.getAttribute('data-kind'); render(); });
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tag]');
    if (t && !t.disabled) { toggle(t.getAttribute('data-tag')); }
    if (e.target.closest('.clear')) { state.tags = []; render(); }
  });
  window.addEventListener('hashchange', function () { readHash(); qEl.value = state.q; render(); });

  var stats = document.getElementById('stats');
  var allTags = uniq([].concat.apply([], items.map(function (i) { return i.tags; })));
  stats.innerHTML = '<span>報告 ' + cat.reports.length + ' 份</span><span>章節 ' + (items.length - cat.reports.length) + ' 節</span><span>標籤 ' + allTags.length + ' 個</span><span>最近更新 ' + (cat.reports[0] ? cat.reports[0].date : '—') + '</span>';

  render();

  function matches(i, tags) {
    if (state.kind !== 'all' && i.kind !== state.kind) return false;
    for (var k = 0; k < tags.length; k++) if (i.tags.indexOf(tags[k]) < 0) return false;
    if (state.q) {
      var hay = (i.title + ' ' + i.summary + ' ' + i.tags.join(' ') + ' ' + i.report.title).toLowerCase();
      if (hay.indexOf(state.q.toLowerCase()) < 0) return false;
    }
    return true;
  }

  function render() {
    writeHash();
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-kind') === state.kind)); });
    var shown = items.filter(function (i) { return matches(i, state.tags); });

    // Tag panel: count how many shown entries carry each tag; a tag that would leave nothing is disabled.
    document.getElementById('tags').innerHTML = groups.map(function (g) {
      return '<div class="group"><h2>' + esc(g.name) + '</h2><div class="chips">' + g.tags.map(function (t) {
        var on = state.tags.indexOf(t) >= 0;
        var n = on ? shown.length : shown.filter(function (i) { return i.tags.indexOf(t) >= 0; }).length;
        return '<button type="button" class="chip" data-tag="' + esc(t) + '" aria-pressed="' + on + '"' + (!on && !n ? ' disabled' : '') + '>' + esc(t) + '<span class="n">' + n + '</span></button>';
      }).join('') + '</div></div>';
    }).join('');

    var act = document.getElementById('active');
    act.innerHTML = state.tags.length
      ? '已選：' + state.tags.map(function (t) { return '<button type="button" class="chip" data-tag="' + esc(t) + '" aria-pressed="true">' + esc(t) + ' ✕</button>'; }).join('') + '<button type="button" class="clear">清除全部</button><span>符合 ' + shown.length + ' 筆</span>'
      : '<span>共 ' + shown.length + ' 筆條目</span>';

    resEl.innerHTML = shown.length ? shown.map(card).join('') : '<p class="empty">沒有同時符合這些條件的條目，試著移除一個標籤。</p>';
  }

  function card(i) {
    var meta = '<div class="meta"><span class="kind">' + (i.kind === 'report' ? '報告' : '章節') + '</span><span>' + esc(i.date) + '</span>' + (i.kind === 'section' ? '<span>出自《' + esc(i.report.title) + '》</span>' : '') + '</div>';
    var files = i.kind === 'report' && i.files.length ? '<div class="files">' + i.files.map(function (f) { return '<a href="' + esc(f.path) + '">' + esc(f.label) + '</a>'; }).join('') + '</div>' : '';
    var tags = '<div class="chips">' + i.show.map(function (t) { return '<button type="button" class="chip" data-tag="' + esc(t) + '" aria-pressed="' + (state.tags.indexOf(t) >= 0) + '">' + esc(t) + '</button>'; }).join('') + '</div>';
    return '<article class="item ' + i.kind + '">' + meta + '<h3><a href="' + esc(i.href) + '">' + esc(i.title) + '</a></h3><p>' + esc(i.summary) + '</p>' + files + tags + '</article>';
  }

  function toggle(t) {
    var k = state.tags.indexOf(t);
    if (k >= 0) state.tags.splice(k, 1); else state.tags.push(t);
    render();
  }
  function readHash() {
    var h = decodeURIComponent(location.hash.slice(1));
    state.tags = []; state.q = '';
    h.split('&').forEach(function (p) {
      var kv = p.split('=');
      if (kv[0] === 't' && kv[1]) state.tags = kv[1].split(',').filter(Boolean);
      if (kv[0] === 'q' && kv[1]) state.q = kv[1];
    });
  }
  function writeHash() {
    var parts = [];
    if (state.tags.length) parts.push('t=' + state.tags.join(','));
    if (state.q) parts.push('q=' + state.q);
    var h = parts.length ? '#' + encodeURIComponent(parts.join('&')).replace(/%3D/g, '=').replace(/%26/g, '&').replace(/%2C/g, ',') : '';
    if (h !== location.hash) { try { history.replaceState(null, '', h || location.pathname + location.search); } catch (e) {} }
  }
  function uniq(a) { return a.filter(function (x, k) { return a.indexOf(x) === k; }); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
})();
</script>
</body>
</html>
